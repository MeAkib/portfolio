# pnpm 11 reads its settings from this file, not from a "pnpm" key in
# package.json, and `allowBuilds` is a map of package -> true, not a list.
#
# These packages run a script at install time: esbuild and @swc/core unpack
# a native binary, lmdb and msgpackr-extract compile one, nx and
# @parcel/watcher set themselves up. pnpm will not run install scripts that
# have not been approved, so they are approved here once instead of being an
# interactive prompt that CI can never answer.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
